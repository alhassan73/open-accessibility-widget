# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing: GitHub proves the workflow's identity to npm (OIDC), so no npm
# token or 2FA code is needed, and the package gets a provenance attestation. One-time setup on
# npmjs.com → package → Settings → Trusted Publisher: GitHub Actions, user `alhassan73`,
# repository `open-accessibility-widget`, workflow `release.yml`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing support (11.5.1+)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip versions already on npm (e.g. published by hand)
        id: npm
        run: echo "published=$(npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version 2>/dev/null)" >> "$GITHUB_OUTPUT"
      # prepublishOnly runs `npm run check` (typecheck, build, size, tests) before publishing.
      - if: steps.npm.outputs.published == ''
        run: npm publish --access public
