# Typecheck, build, size budget, unit + headless-Chrome accessibility tests, docs site build, and
# dependency audit.
name: CI

on:
  pull_request:
  push:
    branches: [main, "[0-9]*.[0-9]*.[0-9]*"] # main and version branches, e.g. 1.1.0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
      # Uses the Chrome preinstalled on GitHub's Ubuntu runners; axe-core comes from devDependencies.
      - run: npm test
      # The docs site (examples/, deployed by Vercel) imports the widget from src/, so it is checked here too.
      - name: Docs site
        run: npm run typecheck -w examples && npm run site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --audit-level=moderate
      - name: Package contents
        run: npm pack --dry-run
